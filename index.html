<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PointScan V3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui}
video,#gl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#gl{z-index:2;pointer-events:none}
#work,#gray{display:none}
#ui{position:fixed;z-index:10;left:8px;right:8px;bottom:8px;padding:10px;border:1px solid #444;border-radius:14px;background:#0b0b0be8;backdrop-filter:blur(8px)}
.row{display:flex;gap:7px;margin-top:7px}button{flex:1;min-height:43px;border:1px solid #555;border-radius:10px;background:#191919;color:white;font-weight:650}
button.on{background:#eee;color:#111}.hint{font-size:11px;color:#bbb;line-height:1.35;margin-top:7px}
#meter{height:5px;background:#333;border-radius:5px;margin-top:7px;overflow:hidden}#meter>div{height:100%;width:0;background:#eee}
</style>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="gl"></canvas><canvas id="work"></canvas><canvas id="gray"></canvas>
<div id="ui">
<b>PointScan V3 — scan spatial</b>
<div class="row"><button id="start">CAMÉRA</button><button id="ai">CHARGER IA</button><button id="shotBtn">CAPTURER</button></div>
<div class="row"><button id="view">IMMERSION</button><button id="reset">EFFACER</button><button id="ply">EXPORT PLY</button></div>
<div class="row"><button id="smaller">POINTS −</button><button id="bigger">POINTS +</button><button id="full">PLEIN ÉCRAN</button></div>
<div id="meter"><div id="bar"></div></div>
<div id="msg" class="hint">Caméra → Charger IA → capture une première vue, puis déplace-toi lentement de 20–40 cm et capture à nouveau.</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
env.allowLocalModels=false;

const $=s=>document.querySelector(s), video=$('#video'), work=$('#work'), wx=work.getContext('2d',{willReadFrequently:true});
const msg=$('#msg'), bar=$('#bar');
let depthPipe=null,busy=false,immersive=false,pointSize=.016;
let pos=[],col=[],prevGray=null,prevPose=new THREE.Matrix4(),captures=0;

const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),alpha:true,antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4)); renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.01,100);
camera.position.set(0,0,.3);
const geom=new THREE.BufferGeometry(), mat=new THREE.PointsMaterial({size:pointSize,vertexColors:true,sizeAttenuation:true});
const cloud=new THREE.Points(geom,mat); scene.add(cloud);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()} addEventListener('resize',resize);resize();
function say(s){msg.textContent=s}
function rebuild(){geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(col,3));geom.computeBoundingSphere()}
async function waitCV(){for(let i=0;i<100;i++){if(globalThis.cv?.Mat)return true;await new Promise(r=>setTimeout(r,100))}return false}

async function cameraOn(){
 const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
 video.srcObject=st;await video.play();say('Caméra active. Charge l’IA.');
}
async function loadAI(){
 if(depthPipe||busy)return;busy=true;say('Chargement IA de profondeur…');bar.style.width='10%';
 try{
  depthPipe=await pipeline('depth-estimation','Xenova/dpt-hybrid-midas',{dtype:'q4',progress_callback:p=>{if(Number.isFinite(p.progress))bar.style.width=Math.min(95,Math.max(10,p.progress))+'%'}});
  bar.style.width='100%';say('IA prête. Capture la première vue.');
 }catch(e){say('Erreur IA : '+e.message);bar.style.width='0%'}finally{busy=false}
}

function grab(W=320){
 const H=Math.round(W*video.videoHeight/video.videoWidth);work.width=W;work.height=H;wx.drawImage(video,0,0,W,H);
 return {W,H,img:wx.getImageData(0,0,W,H)};
}
function makeGray(img,W,H){
 const g=new Uint8Array(W*H);
 for(let i=0,j=0;i<img.data.length;i+=4,j++)g[j]=(img.data[i]*.299+img.data[i+1]*.587+img.data[i+2]*.114)|0;
 return g;
}
function cvMatGray(gray,W,H){let m=new cv.Mat(H,W,cv.CV_8UC1);m.data.set(gray);return m}

async function estimateRelativePose(prevG,curG,W,H){
 if(!await waitCV())return null;
 let a=cvMatGray(prevG,W,H),b=cvMatGray(curG,W,H),p0=new cv.Mat(),p1=new cv.Mat(),st=new cv.Mat(),err=new cv.Mat();
 let mask=new cv.Mat(),E=new cv.Mat(),R=new cv.Mat(),t=new cv.Mat();
 try{
  cv.goodFeaturesToTrack(a,p0,350,.01,7);
  if(p0.rows<25)return null;
  cv.calcOpticalFlowPyrLK(a,b,p0,p1,st,err,new cv.Size(21,21),3);
  const A=[],B=[];
  for(let i=0;i<st.rows;i++)if(st.data[i]){A.push(p0.data32F[i*2],p0.data32F[i*2+1]);B.push(p1.data32F[i*2],p1.data32F[i*2+1])}
  if(A.length/2<20)return null;
  let m0=cv.matFromArray(A.length/2,1,cv.CV_32FC2,A),m1=cv.matFromArray(B.length/2,1,cv.CV_32FC2,B);
  const f=.5*W/Math.tan(67*Math.PI/360), pp=new cv.Point(W/2,H/2);
  E=cv.findEssentialMat(m0,m1,f,pp,cv.RANSAC,.999,1.2,mask);
  if(E.empty()){m0.delete();m1.delete();return null}
  const inliers=cv.recoverPose(E,m0,m1,R,t,f,pp,mask);
  m0.delete();m1.delete();
  if(inliers<15)return null;
  const re=R.data64F.length?R.data64F:R.data32F, te=t.data64F.length?t.data64F:t.data32F;
  const M=new THREE.Matrix4().set(
   re[0],re[1],re[2],te[0],
   re[3],re[4],re[5],te[1],
   re[6],re[7],re[8],te[2],
   0,0,0,1
  );
  return {M,inliers};
 }catch(e){return null}
 finally{[a,b,p0,p1,st,err,mask,E,R,t].forEach(x=>{try{x?.delete()}catch{}})}
}

async function depthForCanvas(){
 const blob=await new Promise(r=>work.toBlob(r,'image/jpeg',.88)),url=URL.createObjectURL(blob);
 try{return await depthPipe(url)}finally{URL.revokeObjectURL(url)}
}
function depthData(out){
 const tensor=out.predicted_depth||out.depth;if(!tensor)return null;
 const d=tensor.data, dims=tensor.dims||[tensor.height,tensor.width],h=dims[dims.length-2],w=dims[dims.length-1];
 let vals=[];for(let i=0;i<d.length;i+=Math.max(1,Math.floor(d.length/5000)))if(Number.isFinite(d[i]))vals.push(d[i]);
 vals.sort((a,b)=>a-b);return {d,w,h,lo:vals[Math.floor(vals.length*.03)],hi:vals[Math.floor(vals.length*.97)]};
}
function sample(D,x,y,W,H){let ix=Math.max(0,Math.min(D.w-1,Math.round(x/W*(D.w-1)))),iy=Math.max(0,Math.min(D.h-1,Math.round(y/H*(D.h-1))));return D.d[iy*D.w+ix]}

async function capture(){
 if(busy)return;if(!video.srcObject){say('Active la caméra.');return}if(!depthPipe){say('Charge l’IA.');return}
 busy=true;bar.style.width='15%';
 try{
  const {W,H,img}=grab(),gray=makeGray(img,W,H);
  let pose=prevPose.clone(),tracking='première vue';
  if(prevGray){
   say('Recalage de la caméra…');const rel=await estimateRelativePose(prevGray,gray,W,H);
   if(rel){
    // recoverPose donne une translation sans échelle. Pas de faux "18 cm" fixe :
    // on emploie un pas conservateur et la direction calculée, pour une reconstruction artistique cohérente.
    const r=rel.M.clone(),e=r.elements,dir=new THREE.Vector3(e[12],e[13],e[14]).normalize();
    e[12]=dir.x*.22;e[13]=dir.y*.22;e[14]=dir.z*.22;
    pose=prevPose.clone().multiply(r.clone().invert());tracking=`tracking ${rel.inliers} points`;
   }else tracking='tracking insuffisant : vue superposée';
  }
  bar.style.width='35%';say('Calcul de profondeur…');
  const out=await depthForCanvas(),D=depthData(out);if(!D)throw Error('profondeur indisponible');
  bar.style.width='70%';
  const f=.5*W/Math.tan(67*Math.PI/360),stride=3,range=Math.max(1e-6,D.hi-D.lo);
  for(let y=0;y<H;y+=stride)for(let x=0;x<W;x+=stride){
   const k=(y*W+x)*4,raw=sample(D,x,y,W,H);
   let n=Math.max(0,Math.min(1,(raw-D.lo)/range));
   // MiDaS fournit une profondeur relative : conversion visuelle bornée.
   let z=.35+(1-n)*3.0;
   let p=new THREE.Vector3((x-W/2)*z/f,-(y-H/2)*z/f,-z).applyMatrix4(pose);
   pos.push(p.x,p.y,p.z);col.push(img.data[k]/255,img.data[k+1]/255,img.data[k+2]/255);
  }
  const cap=240000;if(pos.length/3>cap){let cut=Math.floor(pos.length/3-cap)*3;pos.splice(0,cut);col.splice(0,cut)}
  prevGray=gray;prevPose=pose;captures++;rebuild();bar.style.width='100%';
  say(`Vue ${captures} ajoutée — ${tracking}. Déplace-toi lentement, garde 60–80 % de la scène précédente.`);
 }catch(e){say('Erreur : '+e.message)}finally{busy=false}
}

$('#start').onclick=()=>cameraOn().catch(e=>say('Caméra : '+e.message));$('#ai').onclick=loadAI;$('#shotBtn').onclick=capture;
$('#view').onclick=()=>{immersive=!immersive;video.style.display=immersive?'none':'block';renderer.setClearColor(0x000000,immersive?1:0);$('#view').classList.toggle('on',immersive);say(immersive?'IMMERSION : glisse pour regarder, pince pour avancer/reculer.':'Mode scan.')};
$('#reset').onclick=()=>{pos=[];col=[];prevGray=null;prevPose.identity();captures=0;rebuild();say('Scan effacé.')};
$('#smaller').onclick=()=>{pointSize=Math.max(.003,pointSize*.75);mat.size=pointSize};$('#bigger').onclick=()=>{pointSize=Math.min(.08,pointSize*1.3);mat.size=pointSize};
$('#full').onclick=()=>document.documentElement.requestFullscreen?.();
$('#ply').onclick=()=>{
 let n=pos.length/3,s=`ply\nformat ascii 1.0\nelement vertex ${n}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
 let a=[s];for(let i=0;i<n;i++)a.push(`${pos[i*3]} ${pos[i*3+1]} ${pos[i*3+2]} ${Math.round(col[i*3]*255)} ${Math.round(col[i*3+1]*255)} ${Math.round(col[i*3+2]*255)}\n`);
 let u=URL.createObjectURL(new Blob(a));let l=document.createElement('a');l.href=u;l.download='pointscan-v3.ply';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
};
let last=[];
addEventListener('touchstart',e=>{if(immersive)last=[...e.touches].map(t=>[t.clientX,t.clientY])},{passive:true});
addEventListener('touchmove',e=>{
 if(!immersive)return;let n=[...e.touches].map(t=>[t.clientX,t.clientY]);
 if(n.length===1&&last.length===1){camera.rotation.y-=(n[0][0]-last[0][0])*.006;camera.rotation.x-=(n[0][1]-last[0][1])*.006}
 if(n.length===2&&last.length===2){let a=Math.hypot(last[0][0]-last[1][0],last[0][1]-last[1][1]),b=Math.hypot(n[0][0]-n[1][0],n[0][1]-n[1][1]);camera.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion),(b-a)*.004)}
 last=n
},{passive:true});
(function loop(){renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script>
</body></html>
